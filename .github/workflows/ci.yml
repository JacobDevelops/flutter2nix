name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural:
    name: Structural Checks (Required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # rust-cache keys on the toolchain + Cargo.lock, restores with prefix
      # fallback (partial reuse when Cargo.lock changes), and prunes + re-saves
      # target/ every successful run — unlike a manual actions/cache keyed only
      # on Cargo.lock, which never refreshes target/ for an unchanged lockfile.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Nix flake check
        run: nix flake check

  e2e:
    name: E2E Tests (Allowed to Fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder e2e
        run: echo "TDD entry point — e2e tests land in Phase 1" && exit 0
