name: incremental_app
description: >-
  Fixture exercising everything the incremental Dart split has to get right:
  a native-code plugin, bundled image + font assets, multiple Dart files, a
  runtime dart-define, and obfuscation (see docs/incremental-dart-builds.md).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: RobotoMedium
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf
